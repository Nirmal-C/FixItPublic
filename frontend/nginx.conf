server {
    listen 80;

    # 1. Serve the React app — catch-all. React Router handles /admin and all
    #    other client-side routes. Must come first so more specific blocks below
    #    can take priority for backend paths.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Django backend
    location /api/ {
        proxy_pass http://django-backend-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Kubernetes liveness / readiness health checks
    location /health/ {
        proxy_pass http://django-backend-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Django static files (CSS/JS/images needed by the Django admin panel)
    location /static/ {
        proxy_pass http://django-backend-service:8000;
    }
}
