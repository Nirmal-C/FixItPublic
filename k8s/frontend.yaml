# apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: react-frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: react-frontend

    spec:
      containers:
      - name: react-frontend
        image: groupprojectdemo.azurecr.io/react-frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service

spec:
  type: LoadBalancer

  selector:
    app: react-frontend

  ports:
  - port: 80
    targetPort: 80