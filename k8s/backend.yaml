apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
      - name: django-backend
        image: groupprojectdemo.azurecr.io/django-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/hello/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10      
        livenessProbe:
          httpGet:
            path: /api/hello/
            port: 8000
          initialDelaySeconds: 30 
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: django-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: django-backend
