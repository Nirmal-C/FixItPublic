<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gold rounded square background -->
  <rect width="32" height="32" rx="6" fill="#FFC72C"/>
  <!-- Building2 icon (simplified), dark navy -->
  <g fill="#002040">
    <!-- Main building body -->
    <rect x="8" y="13" width="16" height="13" rx="1"/>
    <!-- Roof / top triangle area -->
    <polygon points="16,6 24,13 8,13"/>
    <!-- Door -->
    <rect x="13" y="20" width="6" height="6" rx="0.5" fill="#FFC72C"/>
    <!-- Windows left -->
    <rect x="10" y="16" width="3" height="3" rx="0.5" fill="#FFC72C"/>
    <!-- Windows right -->
    <rect x="19" y="16" width="3" height="3" rx="0.5" fill="#FFC72C"/>
  </g>
</svg>
