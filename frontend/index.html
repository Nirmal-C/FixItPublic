<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FixIt Public – Tāmaki Makaurau Auckland community maintenance reporting. Report and track public facility issues in your neighbourhood." />
    <meta name="theme-color" content="#EEF2F6" />
    <!-- Prevent flash of dark theme: apply light mode immediately if stored or default -->
    <script>
      (function () {
        if (localStorage.getItem('fixitpublic-theme') !== 'dark') {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>FixIt Public – Community Maintenance Reports</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
