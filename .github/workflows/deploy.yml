name: CI/CD Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'Group_Project'
          cluster-name: 'GroupProjectCluster'

      - name: Create or Update K8s Secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}' \
            --from-literal=DB_NAME='${{ secrets.DB_NAME }}' \
            --from-literal=DB_USER='${{ secrets.DB_USER }}' \
            --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --from-literal=DB_HOST='${{ secrets.DB_HOST }}' \
            --from-literal=AZURE_STORAGE_ACCOUNT_NAME='${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}' \
            --from-literal=AZURE_STORAGE_ACCOUNT_KEY='${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/backend.yaml
            k8s/frontend.yaml
          images: |
            ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:${{ github.sha }}

      # --- Wait for new backend pod ---
      - name: Wait for new Django backend pod to be ready
        run: |
          NEW_POD=$(kubectl get pods -l app=django-backend -o jsonpath="{.items[?(@.status.phase=='Running')].metadata.name}" | awk '{print $1}')
          echo "New pod: $NEW_POD"
          kubectl wait --for=condition=ready pod/$NEW_POD --timeout=120s

      # --- Run migrations on the new pod ---
      - name: Run Django migrations on new pod
        run: |
          NEW_POD=$(kubectl get pods -l app=django-backend -o jsonpath="{.items[?(@.status.phase=='Running')].metadata.name}" | awk '{print $1}')
          echo "Running migrations on pod: $NEW_POD"
          kubectl exec $NEW_POD -- python manage.py migrate --noinput

      # --- Delete old pods safely ---
      - name: Delete old Django pods
        run: |
          NEW_POD=$(kubectl get pods -l app=django-backend -o jsonpath="{.items[?(@.status.phase=='Running')].metadata.name}" | awk '{print $1}')
          for POD in $(kubectl get pods -l app=django-backend -o jsonpath="{.items[*].metadata.name}"); do
            if [ "$POD" != "$NEW_POD" ]; then
              echo "Deleting old pod: $POD"
              kubectl delete pod $POD
            fi
          done
