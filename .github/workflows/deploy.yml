name: CI/CD Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:latest, ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:latest, ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:${{ github.sha }}

  # --- DEPLOY JOB ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'Group_Project'
          cluster-name: 'GroupProjectCluster'

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/backend.yaml
            k8s/frontend.yaml
          images: |
            ${{ secrets.ACR_LOGIN_SERVER }}/django-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/react-frontend:${{ github.sha }}
