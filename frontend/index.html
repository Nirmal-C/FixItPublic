    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FixIt Public – Community maintenance reporting across New Zealand. Report and track public facility issues in your neighbourhood." />

    <!-- Prevent flash of dark theme: apply light mode immediately if stored or default -->
    <script>
      (function () {
        if (localStorage.getItem('fixitpublic-theme') !== 'dark') {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  </body>
