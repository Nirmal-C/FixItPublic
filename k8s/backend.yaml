apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: django-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: django-backend

    spec:
      containers:
      - name: django-backend
        image: groupprojectdemo.azurecr.io/django-backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        envFrom:
        - secretRef:
            name: app-secrets

        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /api/hello/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /api/hello/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: django-backend-service

spec:
  type: ClusterIP

  selector:
    app: django-backend

  ports:
  - port: 8000
    targetPort: 8000
